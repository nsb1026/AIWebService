<section id="cron-view" class="view">
    <header class="view-header">
        <h1 data-i18n="cron_h1">Cron Expression Explainer &amp; Generator</h1>
        <p data-i18n="cron_p">Parse 5-part standard Cron expressions into plain human-readable sentences and calculate future execution timelines.</p>
    </header>

    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_cron_input">Cron Expression (5 Fields: Minute Hour Day Month Weekday)</label>
                <div id="cron-status" class="json-status"></div>
                <button id="btn-cron-clear" class="btn-small danger-btn" data-i18n="btn_reset">Reset</button>
            </div>
            <input type="text" id="cron-input" value="*/15 * * * *" data-i18n="placeholder_cron" placeholder="e.g. */15 * * * *" class="text-input" style="width: 100%; padding: 12px; font-size: 1.1rem; font-family: 'JetBrains Mono', monospace; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">

            <div class="preset-buttons" style="margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="preset-btn btn-small secondary-btn" data-cron="* * * * *">Every Minute (* * * * *)</button>
                <button class="preset-btn btn-small secondary-btn" data-cron="*/15 * * * *">Every 15 Mins (*/15 * * * *)</button>
                <button class="preset-btn btn-small secondary-btn" data-cron="0 * * * *">Hourly (0 * * * *)</button>
                <button class="preset-btn btn-small secondary-btn" data-cron="0 0 * * *">Daily at Midnight (0 0 * * *)</button>
                <button class="preset-btn btn-small secondary-btn" data-cron="0 9 * * 1">Every Mon 9AM (0 9 * * 1)</button>
            </div>
        </div>

        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_cron_explanation">Human-Readable Schedule Explanation</label>
                <button class="copy-btn btn-small" data-target="cron-explanation" data-i18n="btn_copy">Copy Sentence</button>
            </div>
            <textarea id="cron-explanation" readonly style="font-size: 1.1rem; height: 100px; color: var(--accent-color); font-weight: 600;"></textarea>

            <div class="input-header" style="margin-top: 15px;">
                <label data-i18n="label_cron_next_runs">Next 5 Scheduled Executions</label>
            </div>
            <textarea id="cron-schedule" readonly style="height: 120px; font-family: 'JetBrains Mono', monospace;"></textarea>
        </div>
    </div>
</section>
