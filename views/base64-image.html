<section id="base64-image-view" class="view">
    <header class="view-header">
        <h1 data-i18n="base64_h1">Advanced Base64 to Image Reconstruction Tool</h1>
        <p data-i18n="base64_p">Instantly decode and render binary Base64 strings into visual image assets (PNG, JPEG, SVG, WebP).</p>
    </header>
    <div class="converter-container">
        <div class="input-section">
            <div class="input-header">
                <label data-i18n="label_b64_stream">Base64 Data Stream</label>
                <button id="btn-b64-clear" class="btn-small danger-btn" data-i18n="btn_clear">Clear Workspace</button>
            </div>
            <textarea id="b64-input" data-i18n="placeholder_base64" placeholder="Paste raw Base64 string or Data URI..."></textarea>
        </div>
        <div class="preview-section">
            <div class="input-header">
                <label data-i18n="label_visual_reconstruct">Visual Reconstruction</label>
                <div id="b64-status" class="json-status"></div>
            </div>
            <div id="b64-preview-container" class="image-preview-box">
                <p class="placeholder-text">Waiting for valid Base64 input...</p>
            </div>
            <div class="preview-controls">
                <button id="btn-b64-download" class="primary-btn" data-i18n="btn_download" disabled>Export Reconstructed Image</button>
            </div>
        </div>
    </div>
</section>
