<section id="html-view" class="view">
    <header class="view-header">
        <h1 data-i18n="html_h1">Semantic HTML Formatter &amp; Document Optimizer</h1>
        <p data-i18n="html_p">Cleanse, indent, and validate your HTML markup for better SEO, accessibility, and Core Web Vitals performance.</p>
    </header>
    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_raw_markup">Raw Markup Source</label>
                <div id="html-status" class="json-status"></div>
                <button id="btn-html-clear" class="btn-small danger-btn" data-i18n="btn_clear">Clear Workspace</button>
            </div>
            <textarea id="html-input" data-i18n="placeholder_html" placeholder="Paste your raw HTML snippet here..."></textarea>
        </div>
        <div class="parser-controls">
            <button id="btn-html-prettify" class="primary-btn" data-i18n="btn_prettify">Prettify (Semantic)</button>
            <button id="btn-html-minify" class="secondary-btn" data-i18n="btn_minify">Optimize/Minify</button>
            <button id="btn-html-apply" class="secondary-btn" data-i18n="btn_apply">Push to Source</button>
        </div>
        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_standardized_markup">Standardized Output</label>
                <button class="copy-btn btn-small" data-target="html-output" data-i18n="btn_copy">Copy Result</button>
            </div>
            <textarea id="html-output" readonly placeholder="Cleaned markup will appear here..."></textarea>
        </div>
    </div>
</section>
