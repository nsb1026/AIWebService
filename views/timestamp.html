<section id="timestamp-view" class="view">
    <header class="view-header">
        <h1 data-i18n="timestamp_h1">Unix Timestamp &amp; Epoch Timezone Converter</h1>
        <p data-i18n="timestamp_p">Convert Unix Epoch timestamps (seconds &amp; milliseconds) into human-readable ISO 8601, UTC, and KST (Korea Standard Time) formats with real-time live clock feed.</p>
    </header>

    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_live_clock">Current Live Unix Epoch Clock</label>
                <div id="clock-live-status" class="json-status success">LIVE</div>
            </div>
            <div style="background: var(--input-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; margin-bottom: 20px;">
                <span id="live-epoch" style="font-size: 2rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent-color);">0</span>
            </div>

            <div class="input-header">
                <label data-i18n="label_convert_ts">Convert Timestamp / Date Input</label>
                <button id="btn-ts-now" class="btn-small primary-btn" data-i18n="btn_set_now">Set to Current Time</button>
            </div>
            <input type="text" id="ts-input" data-i18n="placeholder_timestamp" placeholder="Paste Unix timestamp in seconds or milliseconds..." class="text-input" style="width: 100%; padding: 12px; font-size: 1.1rem; font-family: 'JetBrains Mono', monospace; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
        </div>

        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_converted_formats">Converted Time Formats</label>
            </div>
            <div class="output-group">
                <div class="field">
                    <label data-i18n="label_iso_string">ISO 8601 Standard String</label>
                    <div class="input-with-button">
                        <input type="text" id="ts-iso" readonly>
                        <button class="copy-btn" data-target="ts-iso" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
                <div class="field">
                    <label data-i18n="label_utc_string">UTC GMT String</label>
                    <div class="input-with-button">
                        <input type="text" id="ts-utc" readonly>
                        <button class="copy-btn" data-target="ts-utc" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
                <div class="field">
                    <label data-i18n="label_kst_string">Korea Standard Time (KST / UTC+9)</label>
                    <div class="input-with-button">
                        <input type="text" id="ts-kst" readonly>
                        <button class="copy-btn" data-target="ts-kst" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
                <div class="field">
                    <label data-i18n="label_relative_time">Relative Time Elapsed</label>
                    <div class="input-with-button">
                        <input type="text" id="ts-relative" readonly>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
