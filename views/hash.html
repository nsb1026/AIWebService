<section id="hash-view" class="view">
    <header class="view-header">
        <h1 data-i18n="hash_h1">Cryptographic Hash &amp; HMAC Generator</h1>
        <p data-i18n="hash_p">Generate cryptographic hashes (SHA-256, SHA-512, SHA-1, MD5) and Hash-based Message Authentication Codes (HMAC) locally in your browser memory using the Web Crypto API.</p>
    </header>

    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_input_msg">Input Message / Payload</label>
                <button id="btn-hash-clear" class="btn-small danger-btn" data-i18n="btn_clear">Clear Workspace</button>
            </div>
            <textarea id="hash-input" data-i18n="placeholder_hash" placeholder="Type or paste text to compute cryptographic hashes..."></textarea>
            
            <div class="input-header" style="margin-top: 15px;">
                <label data-i18n="label_hmac_key">Optional HMAC Secret Key</label>
            </div>
            <input type="text" id="hmac-key" placeholder="Enter secret key to compute HMAC (leave empty for plain hash)..." class="text-input" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
        </div>

        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_computed_hashes">Computed Hashes &amp; Digests</label>
            </div>
            <div class="output-group">
                <div class="field">
                    <label data-i18n="label_sha256">SHA-256 (256-bit Digest)</label>
                    <div class="input-with-button">
                        <input type="text" id="hash-sha256" readonly>
                        <button class="copy-btn" data-target="hash-sha256" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
                <div class="field">
                    <label data-i18n="label_sha512">SHA-512 (512-bit Digest)</label>
                    <div class="input-with-button">
                        <input type="text" id="hash-sha512" readonly>
                        <button class="copy-btn" data-target="hash-sha512" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
                <div class="field">
                    <label data-i18n="label_sha1">SHA-1 (160-bit Digest - Legacy)</label>
                    <div class="input-with-button">
                        <input type="text" id="hash-sha1" readonly>
                        <button class="copy-btn" data-target="hash-sha1" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
                <div class="field">
                    <label data-i18n="label_md5">MD5 (128-bit Checksum - Legacy)</label>
                    <div class="input-with-button">
                        <input type="text" id="hash-md5" readonly>
                        <button class="copy-btn" data-target="hash-md5" data-i18n="btn_copy">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
