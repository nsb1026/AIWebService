<section id="diff-view" class="view">
    <header class="view-header">
        <h1 data-i18n="diff_h1">Intelligent Text &amp; Code Diff Checker</h1>
        <p data-i18n="diff_p">Perform line-by-line and character-by-character comparisons of code versions, API payloads, or text documents.</p>
    </header>
    <div class="diff-input-container">
        <div class="diff-input-side">
            <div class="input-header">
                <label data-i18n="label_original_source">Original Source (Baseline)</label>
                <button id="btn-diff-clear-original" class="btn-small danger-btn" data-i18n="btn_clear">Clear Baseline</button>
            </div>
            <textarea id="diff-input-original" data-i18n="placeholder_diff_orig" placeholder="Original content..."></textarea>
        </div>
        <div class="diff-input-side">
            <div class="input-header">
                <label data-i18n="label_modified_source">Modified Version (Comparison)</label>
                <button id="btn-diff-clear-modified" class="btn-small danger-btn" data-i18n="btn_clear">Clear Comparison</button>
            </div>
            <textarea id="diff-input-modified" data-i18n="placeholder_diff_mod" placeholder="Modified content..."></textarea>
        </div>
    </div>
    <div class="diff-result-section">
        <div class="input-header">
            <label data-i18n="label_diff_analysis">Structural Delta Analysis</label>
            <button class="copy-btn btn-small" data-target="diff-output-raw" data-i18n="btn_copy">Copy Diff Summary</button>
        </div>
        <div id="diff-output" class="diff-output-display">
            <p class="placeholder-text" data-i18n="placeholder_diff_awaiting">Awaiting input in both panels to perform delta analysis...</p>
        </div>
        <textarea id="diff-output-raw" style="display:none;"></textarea>
    </div>
</section>
