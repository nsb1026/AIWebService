<section id="yaml-view" class="view">
    <header class="view-header">
        <h1 data-i18n="yaml_h1">Professional YAML Parser &amp; JSON Converter</h1>
        <p data-i18n="yaml_p">Validate, format, and convert YAML data to JSON. Perfect for debugging Kubernetes configs and CI/CD pipelines.</p>
    </header>
    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_source_yaml">Source YAML</label>
                <div id="yaml-status" class="json-status"></div>
                <button id="btn-yaml-clear" class="btn-small danger-btn" data-i18n="btn_clear_panel">Clear Panel</button>
            </div>
            <textarea id="yaml-input" data-i18n="placeholder_yaml" placeholder="Paste your YAML here..."></textarea>
        </div>
        <div class="parser-controls">
            <button id="btn-yaml-prettify" class="primary-btn" data-i18n="btn_prettify">Validate &amp; Prettify</button>
            <button id="btn-yaml-to-json" class="primary-btn" data-i18n="btn_yaml_to_json">Convert to JSON</button>
            <button id="btn-yaml-apply" class="secondary-btn" data-i18n="btn_apply">Push to Input</button>
        </div>
        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_processed_output">Processed Output</label>
                <button class="copy-btn btn-small" data-target="yaml-output" data-i18n="btn_copy">Copy Result</button>
            </div>
            <textarea id="yaml-output" readonly placeholder="Your structured YAML or JSON will appear here..."></textarea>
        </div>
    </div>
</section>
