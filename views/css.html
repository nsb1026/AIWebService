<section id="css-view" class="view">
    <header class="view-header">
        <h1 data-i18n="css_h1">Modern CSS Formatter &amp; Stylesheet Minifier</h1>
        <p data-i18n="css_p">Format, structure, and optimize your Cascading Style Sheets (CSS). Prettify for seamless code reviews or minify to compress asset delivery.</p>
    </header>
    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_raw_css">Raw CSS Input</label>
                <div id="css-status" class="json-status"></div>
            </div>
            <textarea id="css-input" data-i18n="placeholder_css" placeholder="Paste your raw CSS here..."></textarea>
        </div>
        <div class="parser-controls">
            <button id="btn-css-prettify" class="primary-btn" data-i18n="btn_prettify">Prettify CSS</button>
            <button id="btn-css-minify" class="secondary-btn" data-i18n="btn_minify">Minify CSS</button>
        </div>
        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_optimized_css">Optimized CSS Output</label>
                <button class="copy-btn btn-small" data-target="css-output" data-i18n="btn_copy">Copy Result</button>
            </div>
            <textarea id="css-output" readonly placeholder="Your formatted or minified CSS will appear here..."></textarea>
        </div>
    </div>
</section>
