<section id="curl-view" class="view">
    <header class="view-header">
        <h1 data-i18n="curl_h1">cURL Command to Code Converter</h1>
        <p data-i18n="curl_p">Parse raw cURL commands from browser DevTools, Postman, or terminal into clean executable code snippets for JavaScript, Python, Go, and PHP.</p>
    </header>

    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_curl_input">Raw cURL Command</label>
                <div id="curl-status" class="json-status"></div>
                <button id="btn-curl-clear" class="btn-small danger-btn" data-i18n="btn_clear_input">Clear Input</button>
            </div>
            <textarea id="curl-input" data-i18n="placeholder_curl" placeholder="Paste your cURL command here..."></textarea>
        </div>

        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_target_code">Target Language Code</label>
                <div class="language-tabs">
                    <button class="tab-btn active" data-lang="js-fetch">JS (fetch)</button>
                    <button class="tab-btn" data-lang="js-axios">JS (axios)</button>
                    <button class="tab-btn" data-lang="python">Python (requests)</button>
                    <button class="tab-btn" data-lang="golang">Go (net/http)</button>
                </div>
                <button class="copy-btn btn-small" data-target="curl-output" data-i18n="btn_copy">Copy Code</button>
            </div>
            <textarea id="curl-output" readonly placeholder="Converted code snippet will appear here..."></textarea>
        </div>
    </div>
</section>
