<section id="xml-view" class="view">
    <header class="view-header">
        <h1 data-i18n="xml_h1">Professional XML Formatter &amp; Beautifier</h1>
        <p data-i18n="xml_p">Transform cluttered XML documents, SVG vector graphics, and RSS feeds into clean hierarchical structures.</p>
    </header>
    <div class="parser-container">
        <div class="parser-input-side">
            <div class="input-header">
                <label data-i18n="label_raw_xml">Raw XML / SVG Source</label>
                <div id="xml-status" class="json-status"></div>
                <button id="btn-xml-clear" class="btn-small danger-btn" data-i18n="btn_clear_panel">Clear Panel</button>
            </div>
            <textarea id="xml-input" data-i18n="placeholder_xml" placeholder="Paste your XML, SVG, or XML snippet here..."></textarea>
        </div>
        <div class="parser-controls">
            <button id="btn-xml-prettify" class="primary-btn" data-i18n="btn_prettify">Prettify (Indent 2)</button>
            <button id="btn-xml-minify" class="secondary-btn" data-i18n="btn_minify">Minify XML</button>
            <button id="btn-xml-apply" class="secondary-btn" data-i18n="btn_apply">Push to Input</button>
        </div>
        <div class="parser-output-side">
            <div class="input-header">
                <label data-i18n="label_beautified_xml">Beautified XML</label>
                <button class="copy-btn btn-small" data-target="xml-output" data-i18n="btn_copy">Copy Result</button>
            </div>
            <textarea id="xml-output" readonly placeholder="Your structured XML will appear here..."></textarea>
        </div>
    </div>
</section>
